<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Critter Animation Preview — Neutral</title>
<!-- Real production animation rules — not reimplemented here. -->
<link rel="stylesheet" href="../web/animations.css">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #fbf1e3;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .stage {
    width: 280px;
    padding: 12px;
    background: linear-gradient(180deg, #e6def5 0%, #f4e2dc 55%, #fbe6cc 100%);
    border-radius: 16px;
  }
  .critter {
    position: relative;
    width: 100%;
    aspect-ratio: 320 / 416;
    margin: 0 auto;
  }
  .critter-ground-shadow {
    position: absolute;
    left: 50%;
    bottom: 3%;
    width: 44%;
    height: 9%;
    transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(59, 42, 85, 0.2), rgba(59, 42, 85, 0) 72%);
    border-radius: 50%;
  }
  .critter-bob,
  .critter-blink {
    width: 100%;
    height: 100%;
  }
  .critter-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .label {
    color: #5a4a44;
    font-size: 0.9rem;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="critter" data-mood="neutral">
      <div class="critter-ground-shadow"></div>
      <div class="critter-bob">
        <div class="critter-blink">
          <img class="critter-frame" src="../exports/critter-neutral.png" alt="Neutral critter">
        </div>
      </div>
    </div>
  </div>
  <p class="label">NEUTRAL — periodic blink only (no bob, no ground-shadow pulse, per design)</p>
</body>
</html>
